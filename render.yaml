services:
  # 1. AI Signal Engine (Python Flask)
  - type: web
    name: binomo-ai-engine
    env: python
    buildCommand: "cd ai-engine && pip install -r requirements.txt"
    startCommand: "cd ai-engine && python app.py"
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CLOUDFLARE_API_KEY
        sync: false

  # 2. Backend Express API
  - type: web
    name: binomo-backend
    env: node
    buildCommand: "cd backend && npm install && npm run build"
    startCommand: "cd backend && npm start"
    plan: free
    envVars:
      - key: PORT
        value: 5001
      - key: TWELVE_DATA_API_KEY
        value: 2722ed98484d448f912b7019c92676ae
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CLOUDFLARE_API_KEY
        sync: false
      - key: AI_ENGINE_URL
        fromService:
          type: web
          name: binomo-ai-engine
          property: host

  # 3. Frontend React App
  - type: web
    name: binomo-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
