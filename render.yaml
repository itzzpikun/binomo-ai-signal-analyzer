services:
  # 1. AI Signal Engine (Python Flask)
  - type: web
    name: binomo-ai-engine
    env: python
    buildCommand: "cd ai-engine && pip install -r requirements.txt"
    startCommand: "cd ai-engine && python app.py"
    plan: free
    envVars:
      - key: PORT
        value: 8000

  # 2. Backend Express API
  - type: web
    name: binomo-backend
    env: node
    buildCommand: "cd backend && npm install && npm run build"
    startCommand: "cd backend && npm start"
    plan: free
    envVars:
      - key: PORT
        value: 5001
      - key: TWELVE_DATA_API_KEY
        value: a42fdb0c8c084cde87f9e84a87f4d88f
        sync: false
      - key: GEMINI_API_KEY
        value: AIzaSyBjtP-wRmv06a2ifP3ourXe9FnElt6Pw5k
      - key: OPENAI_API_KEY
        value: key_49MGUQXsHZ55qVKE
      - key: AI_ENGINE_URL
        fromService:
          type: web
          name: binomo-ai-engine
          property: host

  # 3. Frontend React App
  - type: web
    name: binomo-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
