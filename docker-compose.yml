version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: binomo-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: binomo_analyzer

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: binomo-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DEBUG: "false"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: binomo-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - ai-engine
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/binomo_analyzer
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY}
      AI_ENGINE_URL: http://ai-engine:8000
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: binomo-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_WS_URL: ws://localhost:5000

volumes:
  mongodb_data:
