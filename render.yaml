services:
  - type: web
    name: binomo-ai-pro-analyzer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5001"
      - key: AI_ENGINE_URL
        value: http://127.0.0.1:8000
      - key: TWELVE_DATA_API_KEY
        value: 68d13d3465434ad8a40d7db1eda9b8a8
      - key: LLM_ARBITER
        value: "true"
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_API_KEY
        sync: false
